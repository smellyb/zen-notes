[package]
name = "desktop-sticky-notes"
version = "1.0.0"
description = "轻量桌面长条便签与待办工具"
authors = ["zen-notes"]
edition = "2021"

[lib]
name = "desktop_sticky_notes_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
